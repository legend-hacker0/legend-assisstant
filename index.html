<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Legend Assistant</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #151923;
    --text: #e8ecf4;
    --muted: #8a93a6;
    --accent: #6ee7ff;
    --accent2: #a78bfa;
    --user: #1f2633;
    --bot: #171c27;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(circle at top, #161c2b 0%, var(--bg) 60%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid #222838;
  }
  .brand { font-weight: 700; letter-spacing: .5px; font-size: 18px; }
  .brand span { color: var(--accent); }
  .status { font-size: 12px; color: var(--muted); }
  .icon-btn {
    background: none; border: 1px solid #2a3142; color: var(--text);
    border-radius: 10px; padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  #chat {
    flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 85%; padding: 12px 14px; border-radius: 16px; line-height: 1.5;
    white-space: pre-wrap; word-wrap: break-word; font-size: 15px;
  }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--bot); border: 1px solid #222838; border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--muted); font-size: 13px; background: none; }
  .controls {
    padding: 14px 18px 22px; display: flex; flex-direction: column; align-items: center; gap: 12px;
    border-top: 1px solid #222838; background: var(--panel);
  }
  .row { display: flex; gap: 10px; width: 100%; max-width: 620px; }
  #input {
    flex: 1; background: #0e1119; color: var(--text); border: 1px solid #2a3142;
    border-radius: 12px; padding: 12px; font-size: 15px; outline: none;
  }
  #input:focus { border-color: var(--accent); }
  .send {
    background: var(--accent); color: #051018; border: none; border-radius: 12px;
    padding: 0 18px; font-weight: 600; cursor: pointer;
  }
  .mic {
    width: 84px; height: 84px; border-radius: 50%; border: none; cursor: pointer;
    background: radial-gradient(circle at 30% 30%, var(--accent), var(--accent2));
    color: #05080f; font-size: 30px; box-shadow: 0 0 30px rgba(110,231,255,.25);
    transition: transform .15s;
  }
  .mic.listening { animation: pulse 1.1s infinite; }
  .mic:active { transform: scale(.95); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(110,231,255,.6); }
    100% { box-shadow: 0 0 0 26px rgba(110,231,255,0); }
  }
  .toggles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .toggle { font-size: 13px; padding: 7px 12px; border-radius: 999px; }
  .toggle.on { background: var(--accent); color: #051018; border-color: var(--accent); }
  #settings {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7);
    align-items: center; justify-content: center; padding: 20px;
  }
  #settings.open { display: flex; }
  .card {
    background: var(--panel); border: 1px solid #2a3142; border-radius: 16px;
    padding: 20px; width: 100%; max-width: 420px;
  }
  .card label { font-size: 13px; color: var(--muted); display: block; margin-bottom: 6px; }
  .card input, .card textarea {
    width: 100%; background: #0e1119; color: var(--text); border: 1px solid #2a3142;
    border-radius: 10px; padding: 10px; font-size: 14px; margin-bottom: 14px;
  }
  .card textarea { min-height: 80px; resize: vertical; }
  .card .btns { display: flex; gap: 10px; justify-content: flex-end; }
  .card button { padding: 9px 16px; border-radius: 10px; border: none; cursor: pointer; font-weight: 600; }
  .primary { background: var(--accent); color: #051018; }
  .ghost { background: #2a3142; color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="brand">LEGEND <span>ASSISTANT</span></div>
  <div style="display:flex;gap:8px;align-items:center">
    <div class="status" id="status">Ready</div>
    <button class="icon-btn" id="settingsBtn">⚙</button>
    <button class="icon-btn" id="clearBtn">Clear</button>
  </div>
</header>

<div id="chat">
  <div class="msg bot">Hi, I'm Legend Assistant. Tap the mic and talk to me, or type below. Turn on Live mode for a continuous hands-free conversation.</div>
</div>

<div class="controls">
  <div class="row">
    <input id="input" placeholder="Type a message..." autocomplete="off">
    <button class="send" id="sendBtn">Send</button>
  </div>
  <button class="mic" id="micBtn" title="Speak">🎤</button>
  <div class="toggles">
    <button class="icon-btn toggle" id="liveBtn">Live: Off</button>
    <button class="icon-btn toggle on" id="voiceBtn">Voice reply: On</button>
    <button class="icon-btn toggle" id="stopBtn">Stop speaking</button>
  </div>
</div>

<div id="settings">
  <div class="card">
    <label>Gemini API key</label>
    <input id="apiKeyInput" type="password" placeholder="AIza...">
    <label>Assistant personality / instructions</label>
    <textarea id="sysInput"></textarea>
    <div class="btns">
      <button class="ghost" id="cancelSettings">Cancel</button>
      <button class="primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ====== CONFIG ======
  const DEFAULT_API_KEY = "AQ.Ab8RN6IVKfda6g0a2tknXEoPvUzjspYkrWLe-UjU9McOyjL0DQ";
  const MODEL = "gemini-3.8-flash";
  const DEFAULT_SYSTEM = "You are Legend Assistant, a helpful, friendly, and smart AI assistant. Keep spoken answers concise and natural, and use clear language.";

  // ====== STATE ======
  const store = {
    get: (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
  };
  let apiKey = store.get("legend_key", DEFAULT_API_KEY);
  let systemPrompt = store.get("legend_sys", DEFAULT_SYSTEM);
  let history = [];
  let liveMode = false;
  let voiceReply = true;
  let busy = false;

  // ====== ELEMENTS ======
  const $ = id => document.getElementById(id);
  const chat = $("chat"), input = $("input"), statusEl = $("status"), micBtn = $("micBtn");
  const liveBtn = $("liveBtn"), voiceBtn = $("voiceBtn");

  function setStatus(t) { statusEl.textContent = t; }

  function addMsg(text, who) {
    const d = document.createElement("div");
    d.className = "msg " + who;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  // ====== SPEECH OUTPUT ======
  function speak(text) {
    if (!voiceReply || !("speechSynthesis" in window)) return Promise.resolve();
    return new Promise(resolve => {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/[*#`_]/g, ""));
      u.rate = 1.0; u.pitch = 1.0;
      u.onend = resolve; u.onerror = resolve;
      speechSynthesis.speak(u);
    });
  }
  $("stopBtn").onclick = () => { if ("speechSynthesis" in window) speechSynthesis.cancel(); };

  // ====== SPEECH INPUT ======
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recog = null, listening = false;

  function makeRecognizer() {
    const r = new SR();
    r.lang = navigator.language || "en-US";
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;
    return r;
  }

  function startListening() {
    if (!SR) { addMsg("Voice input isn't supported in this browser. Try Chrome or Edge, or type your message.", "sys"); return; }
    if (busy || listening) return;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    recog = makeRecognizer();
    let finalText = "";
    recog.onstart = () => { listening = true; micBtn.classList.add("listening"); setStatus("Listening..."); };
    recog.onresult = e => {
      let interim = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += t; else interim += t;
      }
      input.value = (finalText + interim).trim();
    };
    recog.onerror = e => {
      if (e.error !== "no-speech" && e.error !== "aborted") addMsg("Mic error: " + e.error, "sys");
    };
    recog.onend = () => {
      listening = false; micBtn.classList.remove("listening");
      const text = input.value.trim();
      if (text) { input.value = ""; send(text); }
      else if (liveMode) setTimeout(startListening, 400);
      else setStatus("Ready");
    };
    try { recog.start(); } catch (err) { listening = false; }
  }

  function stopListening() { if (recog && listening) recog.stop(); }

  micBtn.onclick = () => { if (listening) stopListening(); else startListening(); };

  // ====== GEMINI CALL ======
  async function askGemini(userText) {
    history.push({ role: "user", parts: [{ text: userText }] });
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
    const body = {
      systemInstruction: { parts: [{ text: systemPrompt }] },
      contents: history
    };
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) {
      history.pop();
      throw new Error(data?.error?.message || ("HTTP " + res.status));
    }
    const reply = (data.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim()
      || "Sorry, I didn't get a response. Please try again.";
    history.push({ role: "model", parts: [{ text: reply }] });
    return reply;
  }

  // ====== SEND FLOW ======
  async function send(text) {
    if (!text || busy) return;
    busy = true;
    addMsg(text, "user");
    setStatus("Thinking...");
    try {
      const reply = await askGemini(text);
      addMsg(reply, "bot");
      setStatus("Speaking...");
      await speak(reply);
    } catch (err) {
      addMsg("Error: " + err.message, "sys");
    }
    busy = false;
    setStatus(liveMode ? "Live: listening..." : "Ready");
    if (liveMode) setTimeout(startListening, 500);
  }

  $("sendBtn").onclick = () => { const t = input.value.trim(); input.value = ""; send(t); };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { const t = input.value.trim(); input.value = ""; send(t); }
  });

  // ====== TOGGLES ======
  liveBtn.onclick = () => {
    liveMode = !liveMode;
    liveBtn.textContent = "Live: " + (liveMode ? "On" : "Off");
    liveBtn.classList.toggle("on", liveMode);
    if (liveMode) { setStatus("Live: listening..."); startListening(); }
    else { stopListening(); setStatus("Ready"); }
  };
  voiceBtn.onclick = () => {
    voiceReply = !voiceReply;
    voiceBtn.textContent = "Voice reply: " + (voiceReply ? "On" : "Off");
    voiceBtn.classList.toggle("on", voiceReply);
    if (!voiceReply && "speechSynthesis" in window) speechSynthesis.cancel();
  };

  $("clearBtn").onclick = () => {
    history = [];
    chat.innerHTML = "";
    addMsg("Conversation cleared.", "sys");
  };

  // ====== SETTINGS ======
  $("settingsBtn").onclick = () => {
    $("apiKeyInput").value = apiKey;
    $("sysInput").value = systemPrompt;
    $("settings").classList.add("open");
  };
  $("cancelSettings").onclick = () => $("settings").classList.remove("open");
  $("saveSettings").onclick = () => {
    apiKey = $("apiKeyInput").value.trim() || DEFAULT_API_KEY;
    systemPrompt = $("sysInput").value.trim() || DEFAULT_SYSTEM;
    store.set("legend_key", apiKey);
    store.set("legend_sys", systemPrompt);
    $("settings").classList.remove("open");
    addMsg("Settings saved.", "sys");
  };

  if (!SR) micBtn.style.opacity = "0.5";
})();
</script>
</body>
</html>
